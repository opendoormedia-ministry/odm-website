<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login — Insights | Open Door Media</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: var(--paper); }

    .ia-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--sp-5); height: 62px;
      border-bottom: 1px solid var(--hairline);
    }
    .ia-header__brand { display: flex; align-items: center; gap: 14px; }
    .ia-header__logo  { height: 38px; width: auto; display: block; }
    .ia-header__label {
      font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase; color: var(--taupe);
    }
    .ia-header__label span { color: var(--accent); }

    .ia-login {
      min-height: calc(100vh - 62px);
      display: flex; align-items: center; justify-content: center;
      padding: var(--sp-8) var(--sp-5);
    }
    .ia-login__card {
      width: 100%; max-width: 420px;
      background: #fff; border: 1px solid var(--hairline);
      border-radius: 16px 16px 3px 16px; padding: 40px 36px;
      box-shadow: 0 4px 28px rgba(0,0,0,.06);
    }
    .ia-login__eyebrow {
      font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
    }
    .ia-login__heading { font-size: 24px; color: var(--ink); margin-bottom: 28px; line-height: 1.2; }
    .ia-field { margin-bottom: 16px; }
    .ia-label {
      display: block; font-family: 'Montserrat', sans-serif; font-size: 10px;
      font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--taupe); margin-bottom: 6px;
    }
    .ia-input {
      width: 100%; background: var(--panel); border: 1px solid var(--hairline);
      border-radius: 8px; padding: 10px 14px; color: var(--ink);
      font-family: 'DM Sans', sans-serif; font-size: 15px;
      transition: border-color .2s, background .2s; box-sizing: border-box;
    }
    .ia-input:focus { outline: none; border-color: var(--accent); background: #fff; }
    .ia-input::placeholder { color: var(--placeholder); }
    .ia-submit {
      width: 100%; margin-top: 8px; padding: 13px;
      background: var(--accent); border: none; border-radius: 8px 8px 2px 8px;
      font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase; color: var(--paper);
      cursor: pointer; transition: opacity .2s;
    }
    .ia-submit:hover { opacity: .85; }
    .ia-submit:disabled { opacity: .4; cursor: not-allowed; }
    .ia-error {
      margin-top: 14px; padding: 10px 14px;
      background: rgba(180,40,40,.05); border: 1px solid rgba(180,40,40,.22);
      border-radius: 8px; font-size: 13px; color: #b02020;
    }
  </style>
</head>
<body>

  <header class="ia-header">
    <div class="ia-header__brand">
      <img class="ia-header__logo" src="/img/odm-logos/logo-header.svg" alt="Open Door Media">
      <span class="ia-header__label"><span>Insights</span> · Admin</span>
    </div>
  </header>

  <section class="ia-login">
    <div class="ia-login__card">
      <div class="ia-login__eyebrow">Admin Access</div>
      <h1 class="ia-login__heading">Sign in to manage guides.</h1>
      <div class="ia-field">
        <label class="ia-label" for="in-user">Username</label>
        <input class="ia-input" id="in-user" type="text" placeholder="Username" autocomplete="username" spellcheck="false">
      </div>
      <div class="ia-field">
        <label class="ia-label" for="in-pass">Password</label>
        <input class="ia-input" id="in-pass" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="ia-submit" id="btn-login">Sign In →</button>
      <div class="ia-error" id="login-err" hidden></div>
    </div>
  </section>

  <script>
  'use strict';

  const WORKER = 'https://insights-auth.opendoormedia3.workers.dev';

  ['in-user', 'in-pass'].forEach(function (id) {
    document.getElementById(id).addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('btn-login').click();
    });
  });

  document.getElementById('btn-login').addEventListener('click', async function () {
    const username = document.getElementById('in-user').value.trim();
    const password = document.getElementById('in-pass').value;
    const errEl    = document.getElementById('login-err');
    const btn      = document.getElementById('btn-login');
    errEl.hidden   = true;

    if (!username || !password) {
      errEl.textContent = 'Please enter your username and password.';
      errEl.hidden = false;
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      const r = await fetch(WORKER + '/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ username, password }),
      });
      if (!r.ok) {
        const data = await r.json().catch(function () { return {}; });
        throw new Error(data.error || 'Invalid credentials');
      }
      const data = await r.json();
      localStorage.setItem('ins_auth_token', data.token);
      window.location.href = '/insights/admin/dashboard.html';
    } catch (err) {
      errEl.textContent = 'Sign-in failed: ' + err.message;
      errEl.hidden = false;
      btn.disabled = false;
      btn.textContent = 'Sign In →';
    }
  });

  // If already authenticated, skip straight to the dashboard
  (async function () {
    const token = localStorage.getItem('ins_auth_token');
    if (!token) return;
    try {
      const r    = await fetch(WORKER + '/verify', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ token }),
      });
      const data = await r.json();
      if (data.valid) window.location.href = '/insights/admin/dashboard.html';
    } catch { /* network error — stay on login */ }
  })();
  </script>

</body>
</html>
